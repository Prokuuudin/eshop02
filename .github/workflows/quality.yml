name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run check:prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:security
      - run: npm run audit:architecture
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:erp:performance

  accessibility-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      - run: npx playwright install --with-deps webkit
      - if: env.DATABASE_URL != ''
        run: npx playwright test e2e/accessibility.spec.ts --project=mobile-webkit

  firefox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_WEB_SERVER_COMMAND: npx next start -p 3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      - if: env.DATABASE_URL != ''
        run: npx next build --webpack
      - run: npx playwright install --with-deps firefox
      - if: env.DATABASE_URL != ''
        run: npm run test:e2e:smoke:firefox
      - if: env.DATABASE_URL == ''
        run: echo "::warning::Firefox smoke was skipped because DATABASE_URL is unavailable"

  chromium-critical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_WEB_SERVER_COMMAND: npx next start -p 3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      - if: env.DATABASE_URL != ''
        run: npx next build --webpack
      - run: npx playwright install --with-deps chromium
      - if: env.DATABASE_URL != ''
        run: npm run test:e2e:smoke:critical
      - if: env.DATABASE_URL == ''
        run: echo "::warning::Critical Chromium smoke was skipped because DATABASE_URL is unavailable"

  email-delivery-mailpit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_IGNORE_TLS: 'true'
      SMTP_FROM: test@hairshop.example
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run test:email:delivery

  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOAD_BASE_URL: http://localhost:3000
      LOAD_CONCURRENCY: 5
      LOAD_REQUESTS: 20
      LOAD_P95_BUDGET_MS: 2000
      LOAD_MAX_ERROR_RATE: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      - if: env.DATABASE_URL != ''
        run: npx next build --webpack
      - if: env.DATABASE_URL != ''
        run: |
          npm start &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 2
          done
          npm run test:load:smoke
